name: Yaml Lint
on:
  push:
    paths:
      - "**/*.ya?ml"
  pull_request:
    paths:
      - "**/*.ya?ml"
jobs:
  lintAllTheThings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Comprueba iv.yaml y los workflows usando yq
        run: yq eval iv.yaml .github/workflows/*.yml > /dev/null
