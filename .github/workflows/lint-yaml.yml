name: Yaml Lint
on:
  push:
    paths:
      - "**/*.ya?ml"
  pull_request:
    paths:
      - "**/*.ya?ml"
jobs:
  lintAllTheThings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Comprueba todos los ficheros YAML del repositorio usando yq
        run: git ls-files -z '*.yml' '*.yaml' | xargs -0 yq eval > /dev/null
