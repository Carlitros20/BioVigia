name: Rust Lint
on:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/lint-rust.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/lint-rust.yml"
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Instala la versión fijada en rust-toolchain.toml
        run: rustup toolchain install
      - name: Comprueba el formato con rustfmt
        run: cargo fmt --check
      - name: Comprueba el código con Clippy
        run: cargo clippy --all-targets -- -D warnings
